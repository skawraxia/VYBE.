async function openLobby() {
  showPanel("lobbyPanel");
  document.getElementById("roomCodeDisplay").textContent = currentRoom.code;
  await refreshLobby();

  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(refreshLobby, 3000);
}

async function refreshLobby() {
  if (!currentRoomId) return;

  const { data: room, error: roomError } = await supabaseClient
    .from("rooms")
    .select("*")
    .eq("id", currentRoomId)
    .single();

  if (roomError) {
    showStatus("lobbyStatus", roomError.message);
    return;
  }

  currentRoom = room;

  if (room.status === "playing") {
    if (pollInterval) clearInterval(pollInterval);
    showGameScreen();
    return;
  }

  const { data: players, error } = await supabaseClient
    .from("room_players")
    .select("*")
    .eq("room_id", currentRoomId);

  if (error) {
    showStatus("lobbyStatus", error.message);
    return;
  }

  const list = document.getElementById("playersList");
  list.innerHTML = "";

  players.forEach(player => {
    const div = document.createElement("div");
    div.className = "player" + (player.is_host ? " host" : "");
    div.textContent = player.display_name +
      (player.is_host ? "  ·  ODA SAHİBİ" : "");
    list.appendChild(div);
  });

  showStatus(
    "lobbyStatus",
    players.length + " / " + room.max_players + " oyuncu"
  );

  document.getElementById("startButton").classList.toggle(
    "hidden",
    !isHost || players.length < 2
  );
}

function copyRoomCode() {
  if (!currentRoom) return;
  navigator.clipboard.writeText(currentRoom.code);
  showStatus("lobbyStatus", "Oda kodu kopyalandı!");
}

function copyInviteLink() {
  if (!currentRoom) return;
  const link = location.origin + location.pathname +
    "?room=" + currentRoom.code;
  navigator.clipboard.writeText(link);
  showStatus("lobbyStatus", "Davet bağlantısı kopyalandı!");
}

function leaveToHome() {
  if (pollInterval) clearInterval(pollInterval);
  if (gamePollInterval) clearInterval(gamePollInterval);

  currentRoom = null;
  currentRoomId = null;
  gameState = null;
  isHost = false;

  showPanel("homePanel");
}

function buildDeck() {
  const deck = [];

  for (let number = 0; number <= 9; number++) {
    for (let i = 0; i < 4; i++) {
      deck.push({
        id: crypto.randomUUID(),
        type: "NUMBER",
        name: String(number),
        points: number,
        effect: "Sayı kartı",
        symbol: String(number)
      });
    }
  }

  const moveCards = [
    ["ÇALIM",4,15,"Rakibin elinden rastgele bir kart al.","↗"],
    ["SIÇRAMA",3,15,"Sıradaki oyuncunun turunu atla.","⇢"],
    ["YÖN",3,15,"Oyun yönünü tersine çevir.","↺"],
    ["PAS",3,10,"Sıranı geçir ve bir kart çek.","⇥"],
    ["TAKVİYE",4,15,"Bir kart daha çek.","＋"],
    ["TAKAS",3,20,"Bir oyuncuyla elindeki kartları değiştir.","⇄"]
  ];

  moveCards.forEach(([name,count,points,effect,symbol]) => {
    for (let i = 0; i < count; i++) {
      deck.push({
        id: crypto.randomUUID(),
        type: "MOVE",
        name, points, effect, symbol
      });
    }
  });

  const tacticCards = [
    ["KOZ",3,20,"Bir sonraki hamlede ek avantaj kazan.","♛"],
    ["BASKIN",3,25,"Rakiplerden birine iki kart çektir.","⚡"],
    ["KİLİT",2,20,"Bir oyuncunun sonraki hamlesini kilitle.","▣"],
    ["KOPYA",2,20,"Son oynanan hamlenin etkisini tekrar et.","⧉"],
    ["İTTİFAK",2,15,"Bir oyuncuyla geçici iş birliği yap.","♧"],
    ["MÜDAHALE",3,20,"Bir hamlenin etkisini iptal et.","✦"]
  ];

  tacticCards.forEach(([name,count,points,effect,symbol]) => {
    for (let i = 0; i < count; i++) {
      deck.push({
        id: crypto.randomUUID(),
        type: "TACTIC",
        name, points, effect, symbol
      });
    }
  });

  const riskCards = [
    ["YA HEP YA HİÇ",3,30,"Şansını dene: ödül de ceza da büyük.","☯"],
    ["SON ŞANS",2,25,"Risk al ve elini güçlendirmeye çalış.","◈"],
    ["ÇİFTE RİSK",3,25,"İki kat sonuç için risk al.","⚄"],
    ["KATLA",2,20,"Puan etkisini ikiye katla.","×2"]
  ];

  riskCards.forEach(([name,count,points,effect,symbol]) => {
    for (let i = 0; i < count; i++) {
      deck.push({
        id: crypto.randomUUID(),
        type: "RISK",
        name, points, effect, symbol
      });
    }
  });

  const specialCards = [
    ["KAOS",1,40,"Herkesin elindeki kartlar karışır.","✹"],
    ["SIFIRLA",1,35,"Bir oyuncunun puanını sıfırla.","０"],
    ["HÜKÜM",1,40,"Bir oyuncuya ceza kartı ver.","⚖"],
    ["SON SÖZ",1,35,"Turun son hamlesini sen yap.","✧"],
    ["DEVİR",1,30,"Puanını başka oyuncuya devret.","⇄"]
  ];

  specialCards.forEach(([name,count,points,effect,symbol]) => {
    for (let i = 0; i < count; i++) {
      deck.push({
        id: crypto.randomUUID(),
        type: "SPECIAL",
        name, points, effect, symbol
      });
    }
  });

  return shuffle(deck);
}

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

async function startGame() {
  if (!isHost) return;

  try {
    showStatus("lobbyStatus", "Oyun hazırlanıyor...");

    const { data: players, error } = await supabaseClient
      .from("room_players")
      .select("*")
      .eq("room_id", currentRoomId);

    if (error) throw error;

    if (players.length < 2) {
      showStatus("lobbyStatus", "En az iki oyuncu gerekli.");
      return;
    }

    const deck = buildDeck();
    const hands = {};

    players.forEach(player => {
      hands[player.user_id] = deck.splice(0, 5);
    });

    const state = {
      players: players.map(p => ({
        id: p.user_id,
        name: p.display_name,
        score: 0
      })),
      hands,
      deck,
      discard: [],
      currentTurn: 0,
      direction: 1,
      round: 1,
      message: "Oyun başladı! İlk hamle sende.",
      winner: null
    };

    const { error: stateError } = await supabaseClient
      .from("vybe_game_states")
      .insert({
        room_id: currentRoomId,
        state: state
      });

    if (stateError) throw stateError;

    const { error: updateError } = await supabaseClient
      .from("rooms")
      .update({ status: "playing" })
      .eq("id", currentRoomId);

    if (updateError) throw updateError;

    gameState = state;
    showGameScreen();

  } catch (error) {
    showStatus("lobbyStatus", "Hata: " + error.message);
  }
}

function showGameScreen() {
  showPanel("gamePanel");
  document.getElementById("gameStatus").textContent = "VYBE ARENA";
  loadGameState();

  if (gamePollInterval) clearInterval(gamePollInterval);
  gamePollInterval = setInterval(loadGameState, 2500);
}

async function loadGameState() {
  if (!currentRoomId) return;

  const { data, error } = await supabaseClient
    .from("vybe_game_states")
    .select("state")
    .eq("room_id", currentRoomId)
    .maybeSingle();

  if (error || !data) return;

  gameState = data.state;
  renderGame();
}

function renderGame() {
  if (!gameState) return;

  const players = gameState.players;
  const current = players[gameState.currentTurn];

  document.getElementById("turnLabel").textContent =
    "Tur " + gameState.round;

  document.getElementById("currentTurnLabel").textContent =
    current ? current.name : "-";

  document.getElementById("gameMessage").textContent =
    gameState.message || "";

  document.getElementById("scoreBoard").innerHTML = "";

  players.forEach((player,index) => {
    const div = document.createElement("div");
    div.className = "score-chip" +
      (index === gameState.currentTurn ? " active" : "");

    div.innerHTML =
      "<strong>" + escapeHTML(player.name) + "</strong>" +
      "<span>" + player.score + " puan</span>";

    document.getElementById("scoreBoard").appendChild(div);
  });

  const lastCard = gameState.discard[gameState.discard.length - 1];

  document.getElementById("discardPile").textContent =
    lastCard ? lastCard.name : "VYBE.";

  const hand = gameState.hands[currentUser.id] || [];
  const handArea = document.getElementById("playerHand");
  handArea.innerHTML = "";

  const myTurn = current && current.id === currentUser.id &&
    !gameState.winner;

  hand.forEach(card => {
    const button = document.createElement("button");
    button.className = "move-card vybe-card";

    if (card.type === "TACTIC") button.classList.add("card-tactic");
    if (card.type === "RISK") button.classList.add("card-risk");
    if (card.type === "SPECIAL") button.classList.add("card-special");
    if (card.type === "NUMBER") button.classList.add("card-number-type");

    button.disabled = !myTurn || gameBusy;

    button.innerHTML = `
      <div class="move-card-top">
        <span>${escapeHTML(card.type)}</span>
        <span>${card.points} P</span>
      </div>
      <div class="move-card-symbol">
        ${card.type === "NUMBER" ? escapeHTML(card.name) : escapeHTML(card.symbol || "✦")}
      </div>
      <div class="move-card-title">${escapeHTML(card.name)}</div>
      <div class="move-card-effect">${escapeHTML(card.effect)}</div>
      <div class="move-card-play">KARTI OYNA</div>
    `;

    button.onclick = () => playCard(card.id);
    handArea.appendChild(button);
  });

  document.getElementById("drawButton").disabled =
    !myTurn || gameBusy || gameState.deck.length === 0;

  if (gameState.winner) {
    document.getElementById("gameStatus").textContent =
      "KAZANAN: " + gameState.winner.name;
  } else {
    document.getElementById("gameStatus").textContent =
      myTurn ? "SIRA SENDE!" : current.name + " oynuyor...";
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

async function openLobby() {
  document.getElementById("roomCodeDisplay").textContent =
    currentRoom.code;

  showPanel("lobbyPanel");

  const params = new URLSearchParams(window.location.search);

  if (params.has("room")) {
    history.replaceState({}, "", window.location.pathname + "#arena");
  }

  await refreshLobby();

  if (pollInterval) clearInterval(pollInterval);

  pollInterval = setInterval(refreshLobby, 3000);
}

  if (!currentRoomId) return;

  try {
    const { data: room, error: roomError } = await supabaseClient
      .from("rooms")
      .select("*")
      .eq("id", currentRoomId)
      .single();

    if (roomError) throw roomError;

    currentRoom = room;

    if (room.status === "playing") {
      showGameScreen();
      return;
    }

    const { data: players, error: playersError } = await supabaseClient
      .from("room_players")
      .select("*")
      .eq("room_id", currentRoomId)
      .order("joined_at", { ascending: true });

    if (playersError) throw playersError;

    const list = document.getElementById("playersList");
    list.innerHTML = "";

    players.forEach((player, index) => {
      const item = document.createElement("div");
      item.className = "player" + (player.is_host ? " host" : "");

      const name = player.display_name || `Oyuncu ${index + 1}`;

      item.textContent = name + (player.is_host ? "  ·  ODA SAHİBİ" : "");

      list.appendChild(item);
    });

    showStatus(
      "lobbyStatus",
      `${players.length} / ${room.max_players} oyuncu hazır.`
    );

    document.getElementById("startButton")
      .classList.toggle("hidden", !isHost);

  } catch (error) {
    showStatus("lobbyStatus", "Lobi güncellenemedi: " + error.message);
  }
}

function showGameScreen() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
  showPanel("gamePanel");
  loadGameState();
  if (gamePollInterval) clearInterval(gamePollInterval);
  gamePollInterval = setInterval(loadGameState, 2500);
}

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  const deck = [];
  let id = 0;
  for (let n = 0; n <= 9; n++) {
    for (let k = 0; k < 4; k++) deck.push({id:"n"+(++id),type:"NUMBER",name:String(n),value:n,effect:"Sayı kartı",points:n});
  }
  const add = (type,name,count,effect,points=5) => {
    for(let k=0;k<count;k++) deck.push({id:"c"+(++id),type,name,effect,points});
  };
  add("MOVE","ÇALIM",4,"Hedef oyuncudan rastgele 1 kart al.",5);
  add("MOVE","SIÇRAMA",3,"Bu karttan sonra bir kez daha oyna.",5);
  add("MOVE","YÖN",3,"Oyun yönünü tersine çevir.",5);
  add("MOVE","PAS",3,"Sıradaki oyuncunun turunu atlat.",5);
  add("MOVE","TAKVİYE",4,"5 ek puan kazan.",10);
  add("MOVE","TAKAS",3,"Bir oyuncuyla ellerini değiştir.",5);
  add("TACTIC","KOZ",3,"8 puan kazan.",8);
  add("TACTIC","BASKIN",3,"Hedeften 5 puan al.",5);
  add("TACTIC","KİLİT",2,"Sıradaki oyuncunun turunu atlat.",5);
  add("TACTIC","KOPYA",2,"Son kartın puan etkisini kopyala.",5);
  add("TACTIC","İTTİFAK",2,"Sen ve seçtiğin oyuncu 5 puan kazanın.",5);
  add("TACTIC","MÜDAHALE",3,"Hedeften rastgele 1 kart çek.",5);
  add("RISK","YA HEP YA HİÇ",3,"Şansına göre +15 veya -5 puan.",0);
  add("RISK","SON ŞANS",2,"100 puana en yakın oyuncu değilken +10, aksi hâlde +3.",10);
  add("RISK","ÇİFTE RİSK",3,"Şansına göre +20 veya -10 puan.",0);
  add("RISK","KATLA",2,"Bu kartın puan etkisini ikiye katla.",10);
  add("SPECIAL","KAOS",1,"Herkesin elindeki kartları karıştır.",10);
  add("SPECIAL","SIFIRLA",1,"Kendi puanını sıfırla.",0);
  add("SPECIAL","HÜKÜM",1,"15 puan kazan.",15);
  add("SPECIAL","SON SÖZ",1,"Elinde tek kart kaldıysa +20, değilse +5 puan.",5);
  add("SPECIAL","DEVİR",1,"Hedeften 10 puan al.",10);
  return shuffle(deck);
}

function effectSymbol(card) {
  if(card.type==="NUMBER") return String(card.value);
  const symbols = {MOVE:"↗",TACTIC:"✦",RISK:"⚡",SPECIAL:"✧"};
  return symbols[card.type] || "V";
}

function cardClass(type) {
  return type==="TACTIC" ? "card-tactic" :
    type==="RISK" ? "card-risk" :
    type==="SPECIAL" ? "card-special" :
    type==="NUMBER" ? "card-number-type" : "";
}

async function startGame() {
  if (!currentRoom || !isHost || gameBusy) return;
  gameBusy = true;
  try {
    const {data:players,error:playersError} = await supabaseClient
      .from("room_players").select("*").eq("room_id",currentRoomId)
      .order("joined_at",{ascending:true});
    if(playersError) throw playersError;
    if(!players || players.length<2) throw new Error("Başlamak için en az 2 oyuncu gerekli.");

    let deck = buildDeck();
    const gamePlayers = players.map((p,i)=>({
      id:p.user_id, name:p.display_name || `Oyuncu ${i+1}`,
      hand:[], score:0, skipped:false
    }));
    gamePlayers.forEach(p=>{ for(let i=0;i<5;i++) p.hand.push(deck.pop()); });

    const state = {
      version:1, status:"playing", players:gamePlayers, deck,
      discard:[], currentIndex:0, direction:1, turn:1,
      lastMessage:"Oyun başladı! İlk oyuncu kartını oynayabilir.",
      lastPoints:0, winner:null
    };

    const {error:stateError} = await supabaseClient
      .from("vybe_game_states").insert({room_id:currentRoomId,state});
    if(stateError) throw stateError;

    const {error:roomError} = await supabaseClient
      .from("rooms").update({status:"playing"}).eq("id",currentRoomId);
    if(roomError) throw roomError;
    currentRoom.status="playing";
    gameState=state;
    showGameScreen();
  } catch(error) {
    showStatus("lobbyStatus","Oyun başlatılamadı: "+error.message);
  } finally { gameBusy=false; }
}

async function loadGameState() {
  if(!currentRoomId) return;
  try {
    const {data,error} = await supabaseClient.from("vybe_game_states")
      .select("state").eq("room_id",currentRoomId).maybeSingle();
    if(error) throw error;
    if(!data || !data.state) return;
    gameState=data.state;
    renderGame();
  } catch(error) {
    showStatus("gameStatus","Oyun verisi alınamadı: "+error.message);
  }
}

function currentPlayer() {
  return gameState?.players?.[gameState.currentIndex];
}

function renderGame() {
  if(!gameState) return;
  const me=gameState.players.find(p=>p.id===currentUser?.id);
  const turn=currentPlayer();
  const isMyTurn=!!me && turn?.id===me.id && !gameState.winner;
  document.getElementById("turnLabel").textContent=gameState.turn;
  document.getElementById("currentTurnLabel").textContent=turn?.name || "-";
  document.getElementById("gameStatus").textContent=gameState.winner
    ? `${gameState.winner.name} oyunu kazandı!`
    : (isMyTurn ? "Sıra sende! Bir kart oyna." : `Sıra ${turn?.name || "oyuncuda"}.`);
  document.getElementById("gameMessage").textContent=gameState.lastMessage || "";
  const board=document.getElementById("scoreBoard");
  board.innerHTML="";
  gameState.players.forEach((p,i)=>{
    const chip=document.createElement("div");
    chip.className="score-chip"+(i===gameState.currentIndex?" active":"");
    const strong=document.createElement("strong");
    strong.textContent=p.name+(p.id===currentUser?.id?" (Sen)":"");
    const span=document.createElement("span");
    span.textContent=`${p.score} puan · ${p.hand.length} kart`;
    chip.append(strong,span); board.appendChild(chip);
  });
  const top=gameState.discard[gameState.discard.length-1];
  const discard=document.getElementById("discardPile");
  discard.textContent=top ? `${top.name} · ${top.type}` : "VYBE.";
  const hand=document.getElementById("playerHand");
  hand.innerHTML="";
  if(!me) {
    hand.textContent="Bu oyunda oyuncu olarak görünmüyorsun.";
  } else {
    me.hand.forEach(card=>{
      const el=document.createElement("div");
      el.className=`move-card vybe-card ${cardClass(card.type)}`;
      const topLine=document.createElement("div"); topLine.className="move-card-top";
      const cat=document.createElement("span"); cat.textContent=card.type;
      const logo=document.createElement("span"); logo.textContent="VYBE.";
      topLine.append(cat,logo);
      const sym=document.createElement("div"); sym.className="move-card-symbol";
      sym.textContent=effectSymbol(card);
      const title=document.createElement("div"); title.className="move-card-title";
      title.textContent=card.name;
      const effect=document.createElement("div"); effect.className="move-card-effect";
      effect.textContent=card.effect;
      const btn=document.createElement("button"); btn.className="move-card-play";
      btn.textContent=isMyTurn?"KARTI OYNA":"SIRA BEKLENİYOR";
      btn.disabled=!isMyTurn || gameBusy;
      btn.onclick=()=>playCard(card.id);
      el.append(topLine,sym,title,effect,btn); hand.appendChild(el);
    });
  }
  document.getElementById("drawButton").disabled=!isMyTurn || gameBusy || gameState.deck.length===0;
}

function nextIndex(state,steps=1) {
  const n=state.players.length;
  let idx=state.currentIndex;
  for(let i=0;i<steps;i++) {
    idx=(idx+state.direction+n)%n;
    let guard=0;
    while(state.players[idx].skipped && guard<n) {
      state.players[idx].skipped=false;
      idx=(idx+state.direction+n)%n;
      guard++;
    }
  }
  return idx;
}

async function saveGameState(state) {
  const {error}=await supabaseClient.from("vybe_game_states")
    .update({state,updated_at:new Date().toISOString()})
    .eq("room_id",currentRoomId);
  if(error) throw error;
  gameState=state; renderGame();
}

async function drawCard() {
  if(gameBusy || !gameState) return;
  const me=currentPlayer();
  if(me?.id!==currentUser.id || !gameState.deck.length) return;
  gameBusy=true;
  try {
    const state=structuredClone(gameState);
    const player=state.players[state.currentIndex];
    player.hand.push(state.deck.pop());
    state.lastMessage=`${player.name} bir kart çekti ve turunu tamamladı.`;
    state.currentIndex=nextIndex(state);
    state.turn++;
    await saveGameState(state);
  } catch(e) { showStatus("gameStatus","Kart çekilemedi: "+e.message); }
  finally { gameBusy=false; renderGame(); }
}

async function playCard(cardId) {
  if(gameBusy || !gameState || gameState.winner) return;
  const live=gameState.players[gameState.currentIndex];
  if(live?.id!==currentUser.id) return;
  const meIndex=gameState.currentIndex;
  const state=structuredClone(gameState);
  const player=state.players[meIndex];
  const cardIndex=player.hand.findIndex(c=>c.id===cardId);
  if(cardIndex<0) return;
  gameBusy=true;
  try {
    const card=player.hand.splice(cardIndex,1)[0];
    const others=state.players.filter(p=>p.id!==player.id);
    const target=others.length ? others[(Math.random()*others.length)|0] : null;
    const next=state.players[nextIndex(state)];
    let points=card.points||0, extraTurn=false, skipNext=false;
    const randomCard=(from,to)=>{
      if(from?.hand?.length) to.hand.push(from.hand.splice((Math.random()*from.hand.length)|0,1)[0]);
    };
    switch(card.name) {
      case "ÇALIM": randomCard(target,player); break;
      case "SIÇRAMA": extraTurn=true; break;
      case "YÖN": state.direction*=-1; break;
      case "PAS": skipNext=true; break;
      case "TAKVİYE": points=10; break;
      case "TAKAS":
        if(target) [player.hand,target.hand]=[target.hand,player.hand];
        break;
      case "KOZ": points=8; break;
      case "BASKIN":
        if(target){const stolen=Math.min(5,target.score);target.score-=stolen;points+=stolen;}
        break;
      case "KİLİT": skipNext=true; break;
      case "KOPYA": points=state.lastPoints||5; break;
      case "İTTİFAK":
        player.score+=5;if(target)target.score+=5;points=0;break;
      case "MÜDAHALE": randomCard(target,player); break;
      case "YA HEP YA HİÇ":
        points=Math.random()<.5?15:-5;break;
      case "SON ŞANS":
        points=Math.max(...state.players.map(p=>p.score))<player.score+10?3:10;break;
      case "ÇİFTE RİSK":
        points=Math.random()<.5?20:-10;break;
      case "KATLA": points=card.points*2;break;
      case "KAOS":
        {const all=shuffle(state.players.flatMap(p=>p.hand));state.players.forEach(p=>p.hand=[]);all.forEach((c,i)=>state.players[i%state.players.length].hand.push(c));}
        break;
      case "SIFIRLA": player.score=0;points=0;break;
      case "HÜKÜM": points=15;break;
      case "SON SÖZ": points=player.hand.length===0?20:5;break;
      case "DEVİR":
        if(target){const taken=Math.min(10,target.score);target.score-=taken;points+=taken;}
        break;
    }
    player.score+=points;
    state.lastPoints=points;
    state.discard.push(card);
    state.lastMessage=`${player.name}, ${card.name} oynadı${points?` (${points>0?"+":""}${points} puan)`:""}.`;
    if(player.score>=100) {
      state.winner={id:player.id,name:player.name};
      state.status="finished";
    } else {
      if(skipNext) next.skipped=true;
      if(!extraTurn) { state.currentIndex=nextIndex(state); state.turn++; }
    }
    await saveGameState(state);
    if(state.winner) {
      await supabaseClient.from("rooms").update({status:"finished"}).eq("id",currentRoomId);
    }
  } catch(e) { showStatus("gameStatus","Hamle kaydedilemedi: "+e.message); }
  finally { gameBusy=false; renderGame(); }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const temporary = document.createElement("textarea");
    temporary.value = text;
    document.body.appendChild(temporary);
    temporary.select();

    const success = document.execCommand("copy");
    temporary.remove();

    return success;
  }
}

async function copyRoomCode() {
  if (!currentRoom) return;

  const success = await copyText(currentRoom.code);

  showStatus(
    "lobbyStatus",
    success ? "Oda kodu kopyalandı!" : "Kod: " + currentRoom.code
  );
}

async function copyInviteLink() {
  if (!currentRoom) return;

  const link = window.location.origin +
    window.location.pathname +
    "?room=" + currentRoom.code + "#arena";

  const success = await copyText(link);

  showStatus(
    "lobbyStatus",
    success ? "Davet bağlantısı kopyalandı!" : link
  );
}

function leaveToHome() {
  if (pollInterval) {
    clearInterval(pollInterval);
    pollInterval = null;
  }
  if (gamePollInterval) {
    clearInterval(gamePollInterval);
    gamePollInterval = null;
  }

  gameState = null;
  currentRoom = null;
  currentRoomId = null;
  isHost = false;

  history.replaceState({}, "", window.location.pathname);
  showPanel("homePanel");
}

async function initializeVYBE() {
  loadPreferences();

  try {
    await ensureUser();

    const params = new URLSearchParams(window.location.search);
    const inviteCode = params.get("room");

    if (inviteCode) {
      document.getElementById("joinCode").value =
        inviteCode.toUpperCase();

      toggleJoinOptions(true);
      showStatus("homeStatus", "Davet odası bulundu. Katıl butonuna bas.");
    }

  } catch (error) {
    showStatus("homeStatus", "Bağlantı hatası: " + error.message);
  }
}

initializeVYBE();
</script>
